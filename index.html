<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pixel Box</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1f24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pixel Box">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--dp:clamp(116px,33vw,150px);--bs:clamp(54px,15vw,68px)}
  html,body{margin:0;height:100%;background:#1b1f24;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Press Start 2P",system-ui,sans-serif}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #console{position:relative;box-sizing:border-box;width:min(100vw,470px);height:min(100%,940px);display:flex;flex-direction:column;
    background:linear-gradient(160deg,#dedad2,#c8c4bc 55%,#b7b3ab);border-radius:14px 14px 72px 14px;padding:12px 12px 0;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -6px 0 rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.5)}
  #bezel{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:#575c69;border-radius:10px 10px 44px 10px;
    padding:28px 16px 16px 28px;box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
  #bzl{position:absolute;top:12px;left:12px;right:42px;display:flex;align-items:center;gap:7px;font-size:6px;color:#c3c6d4;letter-spacing:1px;white-space:nowrap}
  #bzl i{flex:1;height:2px;background:#9b2f61;border-bottom:2px solid #3e5396}
  #vol{position:absolute;top:3px;right:8px;border:0;background:transparent;padding:3px 4px;cursor:pointer;line-height:0;color:#dfe3ec}
  #vol svg{display:block;width:20px;height:17px}
  #vol.off{color:#ff8f8f}
  #vol:active{transform:translateY(1px)}
  #led{position:absolute;left:10px;top:40%;width:9px;height:9px;border-radius:50%;background:#e8252b;box-shadow:0 0 8px #ff3b3b,inset 0 -2px 2px rgba(0,0,0,.3)}
  #ledl{position:absolute;left:3px;top:calc(40% + 15px);font-size:5px;color:#c3c6d4}
  #screenbox{position:relative;flex:1 1 auto;min-height:0;background:#0d130e;border-radius:4px;overflow:hidden;box-shadow:0 0 0 2px #3c404a,0 1px 0 3px rgba(255,255,255,.06)}
  #screenbox::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 3px 8px rgba(0,0,0,.35);background:linear-gradient(140deg,rgba(255,255,255,.07),rgba(255,255,255,0) 38%)}
  #scr{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
  #brand{flex:none;padding:9px 4px 0 6px;color:#2c3a7a;font-size:14px;font-style:italic;letter-spacing:1px}
  #brand b{font-style:normal;margin-left:6px}
  #controls{position:relative;flex:none}
  #legend{display:none}
  #console.fit #bezel{flex:0 1 auto}
  #console.fit #screenbox{flex:none}
  #console.fit #legend{display:flex;flex:1 1 0;min-height:0;overflow:hidden;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:4px 6px;color:#2c3a7a}
  #legend .gt{font-size:clamp(17px,5.4vw,24px);font-weight:800;font-style:italic;letter-spacing:2px;opacity:.85}
  #legend .ks{display:flex;flex-wrap:wrap;justify-content:center;gap:9px 15px;max-width:380px}
  #legend .it{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.5px;white-space:nowrap}
  #legend .k{display:inline-flex;align-items:center;justify-content:center;flex:none}
  #legend .k.r{width:19px;height:19px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4508a,#9c1b55);color:#fff;font-size:10px;font-weight:700}
  #legend .k.p{height:13px;padding:0 6px;border-radius:7px;background:#8e8f99;color:#fff;font-size:7.5px;font-weight:700;letter-spacing:1px}
  #legend .k.d{width:17px;height:17px;background:linear-gradient(#34373f,#34373f) center/6px 17px no-repeat,linear-gradient(#34373f,#34373f) center/17px 6px no-repeat}
  #legend.compact .gt{display:none}
  #legend.tiny{visibility:hidden}
  #ctrlin{position:relative;width:100%;height:clamp(200px,33vh,280px)}
  #cl{position:absolute;left:4%;top:10%}
  #dpad{position:relative;width:var(--dp);height:var(--dp);touch-action:none;perspective:320px;cursor:pointer}
  #dpin{position:absolute;inset:0;transition:transform .04s;transform-style:preserve-3d}
  #dpin .h,#dpin .v{position:absolute;background:linear-gradient(#41444c,#1e2025);border-radius:7px;box-shadow:0 5px 0 #0e0f12,inset 0 1px 0 rgba(255,255,255,.14)}
  #dpin .h{left:0;right:0;top:33.5%;height:33%}
  #dpin .v{top:0;bottom:0;left:33.5%;width:33%}
  #dpin .c{position:absolute;left:41%;top:41%;width:18%;height:18%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#16171b,#33363d)}
  #dpin .ar{position:absolute;color:#5d616b;font-size:10px;font-family:system-ui,sans-serif;transform:translate(-50%,-50%)}
  #cr{position:absolute;right:4%;top:6%;width:calc(var(--bs)*2.25);height:calc(var(--bs)*1.75)}
  .bt{position:absolute;width:var(--bs);height:var(--bs);border-radius:50%;background:radial-gradient(circle at 35% 30%,#cf5a8d,#9c2459 58%,#7a1743);
    box-shadow:0 5px 0 #4f0d2b,inset 0 2px 0 rgba(255,255,255,.25);touch-action:none;cursor:pointer}
  .bt.on{transform:translateY(4px);box-shadow:0 1px 0 #4f0d2b}
  .bt span{position:absolute;left:50%;top:calc(100% + 11px);transform:translateX(-50%);font-size:11px;color:#2c3a7a}
  #bB{left:0;bottom:0} #bA{right:0;top:0}
  #cm{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);display:flex;gap:20px}
  .pw{display:flex;flex-direction:column;align-items:center;gap:8px;transform:rotate(-24deg)}
  .pill{width:52px;height:14px;border-radius:8px;background:linear-gradient(#a2a2aa,#7a7a82);box-shadow:0 3px 0 #55555c,inset 0 1px 0 rgba(255,255,255,.35);touch-action:none;cursor:pointer}
  .pill.on{transform:translateY(2px);box-shadow:0 1px 0 #55555c}
  .pw span{font-size:7px;color:#2c3a7a;letter-spacing:1px}
  #grille{position:absolute;right:6%;bottom:6%;display:flex;gap:7px;transform:rotate(-28deg)}
  #grille i{width:6px;height:52px;border-radius:4px;background:#a9a59d;box-shadow:inset 1px 2px 2px rgba(0,0,0,.35)}
  #hint{display:none;color:#8a93a0;font-size:8px;line-height:2;text-align:center;padding:8px}
  @media (hover:hover) and (pointer:fine){#hint{display:block}#console{height:min(calc(100% - 52px),900px)}}
  @media (orientation:landscape) and (max-height:560px){
    :root{--dp:min(128px,36vh);--bs:min(58px,17vh)}
    #console{width:100vw;height:100%;border-radius:0;padding:8px;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1fr auto;
      grid-template-areas:"cl bezel cr" "cm bezel gr";column-gap:8px}
    #bezel{grid-area:bezel;width:min(calc((100vh - 16px) * 1.3),64vw);padding:24px 12px 12px 24px}
    #bzl{top:9px}
    #vol{top:1px}
    #brand,#legend{display:none!important}
    #controls,#ctrlin{display:contents}
    #cl{grid-area:cl;position:static;align-self:center;justify-self:center}
    #cr{grid-area:cr;position:relative;right:auto;top:auto;align-self:center;justify-self:center}
    #cm{grid-area:cm;position:static;transform:none;justify-self:center;align-self:center;gap:12px}
    #grille{grid-area:gr;position:static;justify-self:center;align-self:center;transform:rotate(-28deg) scale(.6)}
    #hint{display:none!important}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="console">
    <div id="bezel">
      <div id="bzl"><i></i><span id="bzt">PIXEL BOX</span><i></i></div>
      <button id="vol" title="Volume" aria-label="Volume"></button>
      <div id="led"></div><div id="ledl">ON</div>
      <div id="screenbox"><canvas id="scr"></canvas></div>
    </div>
    <div id="brand">PIXEL<b>BOX</b></div>
    <div id="legend"></div>
    <div id="controls"><div id="ctrlin">
      <div id="cl"><div id="dpad"><div id="dpin"><div class="h"></div><div class="v"></div><div class="c"></div>
        <span class="ar" style="left:50%;top:16%">▲</span><span class="ar" style="left:50%;top:84%">▼</span>
        <span class="ar" style="left:16%;top:50%">◀</span><span class="ar" style="left:84%;top:50%">▶</span></div></div></div>
      <div id="cr"><div class="bt" id="bB"><span>B</span></div><div class="bt" id="bA"><span>A</span></div></div>
      <div id="cm"><div class="pw"><div class="pill" id="bSel"></div><span>SELECT</span></div><div class="pw"><div class="pill" id="bSta"></div><span>START</span></div></div>
      <div id="grille"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div></div>
  </div>
  <div id="hint">FRECCE = CROCE · X = A · Z = B · INVIO = START · ESC = SELECT (MENU)</div>
</div>
<script>
(() => {
'use strict';
const APP = {"v": "1.4", "id": "1.4-95b5eb5a", "date": "19/11/2026", "pwa": true};
// ===================== PIXEL BOX · sistema comune =====================
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const overlap = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const GAMES = [];

// ---------- audio condiviso ----------
let actx = null, master = null, noiseBuf = null, muted = false, volLevel = 2;   // volume: 0 spento, 1 medio, 2 alto
const VOLS = [0, 0.8, 1.6];
try { const v = localStorage.getItem('px_vol'); volLevel = v !== null ? clamp(parseInt(v, 10) || 0, 0, 2) : (localStorage.getItem('px_muted') === '1' ? 0 : 2); } catch (e) {}
muted = volLevel === 0;
// su iPhone "playback" fa suonare i giochi anche con il tasto silenzioso; da spento non interrompe la musica
function audioSession() { try { if (navigator.audioSession) navigator.audioSession.type = muted ? 'ambient' : 'playback'; } catch (e) {} }
function setVolume(l) {
  volLevel = l; muted = l === 0;
  if (master) master.gain.setTargetAtTime(VOLS[l], actx.currentTime, 0.02);
  audioSession();
  try { localStorage.setItem('px_vol', String(l)); } catch (e) {}
}
// I telefoni accendono l'audio solo dentro un gesto completo (dito che si stacca, tap, tasto):
// audioUnlock viene chiamata a ogni tocco finché il suono non è attivo davvero.
function audioUnlock() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.12;
      master = actx.createGain(); master.gain.value = VOLS[volLevel];
      master.connect(comp); comp.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.8), actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      audioSession();
    } catch (e) { actx = null; }
  }
  if (actx && actx.state !== 'running') {
    actx.resume().catch(() => {});
    try { const s = actx.createBufferSource(); s.buffer = actx.createBuffer(1, 1, 22050); s.connect(actx.destination); s.start(0); } catch (e) {}
  }
}
const aok = () => !muted && actx && actx.state === 'running';
function tone(f, dur, type = 'square', vol = 0.035, to = null, delay = 0) {
  if (!aok()) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t + dur * 0.85); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol) {
  if (!aok()) return;
  const t = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(2500, t); f.frequency.exponentialRampToValueAtTime(200, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + Math.min(dur, 0.78) + 0.02);
}
const seq = (n, d, gap, vol = 0.04) => n.forEach((f, i) => tone(f, d, 'square', vol, null, i * gap));

// ---------- carattere 3×5 e schermo LCD ----------
const FONT = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111',
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111',
  F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010',
  K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '111101101101101', O: '010101101101010',
  P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
  Z: '111001010100111', ' ': '000000000000000', '!': '010010010000010', '.': '000000000000010', ':': '000010000010000',
  '-': '000000111000000', '+': '000010111010000', '/': '001001010100100', '?': '111001010000010', 'x': '000101010101000',
  '<': '001010100010001', '>': '100010001010100', '=': '000111000111000'
};
function S(rows) { const h = rows.length, w = rows[0].length, d = new Uint8Array(w * h); rows.forEach((r, y) => { for (let x = 0; x < w; x++) d[y * w + x] = r[x] === '#' ? 1 : 0; }); return { w, h, d }; }
const HEART = S(['#.#', '###', '.#.']), HEART5 = S(['.#.#.', '#####', '#####', '.###.', '..#..']);
const LCD_BG = '#c5cf80', LCD_PIX = '#222b15';

function makeLCD(SW, SH) {
  const fb = new Uint8Array(SW * SH), fbDim = new Uint8Array(SW * SH), ghost = new Float32Array(SW * SH);
  function px(x, y) { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < SW && y >= 0 && y < SH) fb[y * SW + x] = 1; }
  function unpx(x, y) { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < SW && y >= 0 && y < SH) fb[y * SW + x] = 0; }
  function spr(s, x, y) { x = Math.round(x); y = Math.round(y); for (let j = 0; j < s.h; j++) for (let i = 0; i < s.w; i++) if (s.d[j * s.w + i]) px(x + i, y + j); }
  function text(str, x, y, sc = 1) {
    x = Math.round(x); y = Math.round(y);
    for (let n = 0; n < str.length; n++) {
      const g = FONT[str[n]] || FONT['?'];
      for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (g[r * 3 + c] === '1')
        for (let a = 0; a < sc; a++) for (let b = 0; b < sc; b++) px(x + n * 4 * sc + c * sc + a, y + r * sc + b);
    }
  }
  const textW = (str, sc = 1) => (str.length * 4 - 1) * sc;
  const ctext = (str, y, sc = 1) => text(str, Math.round((SW - textW(str, sc)) / 2), y, sc);
  function clearBox(x, y, w, h) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) unpx(i, j); }
  function frame(x, y, w, h) { for (let i = x; i < x + w; i++) { px(i, y); px(i, y + h - 1); } for (let j = y; j < y + h; j++) { px(x, j); px(x + w - 1, j); } }
  function banner(lines, top = 6) {
    const w = Math.min(SW, Math.max(...lines.map(l => textW(l))) + 8), h = lines.length * 7 + 5;
    const x = Math.round((SW - w) / 2), y = Math.round(top + (SH - top - h) / 2);
    clearBox(x, y, w, h); frame(x, y, w, h);
    lines.forEach((l, i) => ctext(l, y + 3 + i * 7));
  }
  // disegna il framebuffer su tutto lo schermo della console, con scie e ombre dei cristalli liquidi
  function render(c, W, H) {
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = LCD_BG; c.fillRect(0, 0, W, H);
    const gl = c.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.05, W / 2, H / 2, Math.max(W, H) * 0.62);
    gl.addColorStop(0, 'rgba(255,255,215,0.28)'); gl.addColorStop(0.6, 'rgba(255,255,215,0.06)'); gl.addColorStop(1, 'rgba(40,50,10,0.16)');
    c.fillStyle = gl; c.fillRect(0, 0, W, H);
    const k = Math.min((W - 8) / SW, (H - 8) / SH), ox = Math.round((W - SW * k) / 2), oy = Math.round((H - SH * k) / 2);
    const gap = k >= 5 ? Math.max(1, Math.round(k * 0.09)) : 0, sh = Math.max(1, Math.round(k * 0.16));
    const X = new Int32Array(SW + 1), Y = new Int32Array(SH + 1);
    for (let i = 0; i <= SW; i++) X[i] = ox + Math.round(i * k);
    for (let j = 0; j <= SH; j++) Y[j] = oy + Math.round(j * k);
    for (let i = 0; i < fb.length; i++) ghost[i] = fb[i] ? 1 : ghost[i] * 0.45;
    const pass = (style, test, off) => {
      c.fillStyle = style; c.beginPath();
      for (let i = 0; i < fb.length; i++) if (test(i)) { const x = i % SW, y = (i / SW) | 0; c.rect(X[x] + off, Y[y] + off, X[x + 1] - X[x] - gap, Y[y + 1] - Y[y] - gap); }
      c.fill();
    };
    pass('rgba(30,40,12,0.15)', i => fb[i], sh);
    pass('rgba(34,43,21,0.38)', i => !fb[i] && ghost[i] > 0.3, 0);
    pass('rgba(34,43,21,0.16)', i => !fb[i] && ghost[i] > 0.1 && ghost[i] <= 0.3, 0);
    pass('rgba(34,43,21,0.12)', i => !fb[i] && fbDim[i], 0);
    pass(LCD_PIX, i => fb[i], 0);
    if (gap) {
      c.fillStyle = 'rgba(70,80,30,0.07)';
      for (let x = 1; x <= SW; x++) c.fillRect(X[x] - gap, Y[0], gap, Y[SH] - Y[0]);
      for (let y = 1; y <= SH; y++) c.fillRect(X[0], Y[y] - gap, X[SW] - X[0], gap);
    }
  }
  return { SW, SH, fb, fbDim, ghost, px, unpx, spr, text, textW, ctext, clearBox, frame, banner, render };
}
// piccola icona a pixel per il menu: righe di caratteri, ogni carattere = un colore
function drawIcon(c, rows, pal, x, y, s, bg) {
  const n = rows.length, p = s / n;
  if (bg) { c.fillStyle = bg; c.fillRect(x, y, s, s); }
  for (let j = 0; j < n; j++) for (let i = 0; i < rows[j].length; i++) {
    const col = pal[rows[j][i]]; if (!col) continue;
    c.fillStyle = col; c.fillRect(Math.round(x + i * p), Math.round(y + j * p), Math.ceil(p), Math.ceil(p));
  }
}

// ---------- schermo e tasti della console ----------
const cv = $('scr'), ctx = cv.getContext('2d');
let W = 320, H = 288, dpr = 1;
const BTN = { up: false, down: false, left: false, right: false, a: false, b: false, start: false, select: false };
const kbB = {}, tB = {};
const PF = s => Math.max(6, Math.round(s)) + 'px "Press Start 2P", monospace';

// ===================== PALLINE E BLOCCHI =====================
GAMES.push((() => {
const GW = 700, CELL = 100, COLS = 7, LAST = 8, GH = 9 * CELL + 130;
const R = 11, GAP = 5, SZ = CELL - 2 * GAP, FLOOR = GH - R - 6, SPEED = 16, MINVY = 0.17;
const AMIN = 0.18, AMAX = Math.PI - 0.18;

let blocks = [], pickups = [], balls = [], particles = [];
let ballCount = 1, level = 1, launchX = GW / 2, pendingExtra = 0, best = 1;
let state = 'aim', aiming = false, aimX = 0, aimY = 0, shootDir = null, aimAngle = Math.PI / 2, aimHold = 0, touchAim = false;
let toLaunch = 0, launchTimer = 0, firstLand = null, shootTime = 0, anim = 0, tick = 0;

function mk(W, H) {
  const g = [], wat = [];
  for (let y = 0; y < H; y++) { g.push(Array(W).fill(' ')); wat.push(Array(W).fill(false)); }
  const L = { W, H, g, wat, objs: [], en: [], start: [2, H - 2] };

  L.o = (t, x, y) => { L.objs.push({ t, x, y }); return L; };
  L.e = (x, y, axis, min, max, speed) => { L.en.push({ x0: x, y0: y, axis, min, max, speed }); return L; };
  L.fill(0, 0, W - 1, 0, '#').fill(0, H - 1, W - 1, H - 1, '#').fill(0, 0, 0, H - 1, '#').fill(W - 1, 0, W - 1, H - 1, '#');

}

  const H = rows.length, W = rows[0].length, L = mk(W, H);
  const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? '#' : rows[y][x];

// ---------- mappa ----------
function tile(x, y) { if (x < 0 || y < 0 || x >= L.W || y >= L.H) return '#'; return L.g[y][x]; }

function waterSub(b) {

  let ty = Math.floor(b.y + b.r * 0.98);
  if (!isWater(tx, ty)) { ty = Math.floor(b.y); if (!isWater(tx, ty)) return 0; }

}

}

// ---------- gioco ----------

  ringsTotal = L.objs.filter(o => o.t === 'ring').length; ringsGot = 0;

}
function spawnBall() {

}

function pop() {

}
function complete() {

function collide(b) {
  let jumped = false;
  const x0 = Math.floor(b.x - b.r), x1 = Math.floor(b.x + b.r), y0 = Math.floor(b.y - b.r), y1 = Math.floor(b.y + b.r);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const ch = tile(tx, ty);
    if (!isSolid(ch)) continue;
    const px = clamp(b.x, tx, tx + 1), py = clamp(b.y, ty, ty + 1);
    const dx = b.x - px, dy = b.y - py, d2 = dx * dx + dy * dy;

    let nx, ny, pen;

    if (ground) b.grounded = true;
    if (vn >= 0) continue;
    if (ground) {
      b.vx -= vn * nx; b.vy -= vn * ny;
      if (-vn > 7) b.sq = Math.min(0.28, -vn / 55);
      if (ch === 'B') {
        if (keys.jump && !jumped) { b.vy = -RUBBER; jumped = true; sfx.boing(); }
        else if (-vn > 2.5) { b.vx += nx * -vn * 0.72; b.vy += ny * -vn * 0.72; sfx.boing(true); }
      } else if (keys.jump && !jumped) { b.vy = -JUMP; jumped = true; sfx.jump(); }

}

function hazard(b) {

function objects(b) {

    const cx = o.x + 0.5, cy = o.y + 0.5;
    switch (o.t) {
      case 'ring':
        if (b.x > o.x + 0.12 && b.x < o.x + 0.88 && b.y > o.y && b.y < o.y + 2) {
          o.got = true; ringsGot++; score += 500; sfx.ring(); burst(cx, o.y + 1, '#f6c915', 10, 4);
          if (ringsGot === ringsTotal) { setTimeout(sfx.open, 180); showToast('PORTA APERTA!'); }
          hud();
        }
        break;
      case 'life':
        if (dist(b, cx, cy) < b.r + 0.35) { o.got = true; lives++; score += 1000; sfx.life(); burst(cx, cy, '#ff6b5e', 12, 4); showToast('VITA EXTRA!'); hud(); }
        break;
      case 'cp':
        if (!o.on && dist(b, cx, cy) < b.r + 0.42) {
          o.on = true; respawn = { x: cx, bottom: o.y + 1, big: b.big }; score += 500;
          sfx.cp(); showToast('SALVATO!'); hud();

        break;
      case 'infl':
        if (!b.big && dist(b, cx, cy) < b.r + 0.4) { b.big = true; b.y -= RB - RS; b.r = RB; sfx.infl(); showToast('GONFIATA!'); }
        break;
      case 'defl':
        if (b.big && dist(b, cx, cy) < b.r + 0.35) { b.big = false; b.y += RB - RS; b.r = RS; sfx.defl(); showToast('SGONFIATA!'); }
        break;
      case 'exit':
        if (overlapRect(b, o.x + 0.1, o.y, o.x + 0.9, o.y + 2, b.r)) {
          if (ringsGot >= ringsTotal) { burst(cx, o.y + 1, '#ffd23f', 30, 6); complete(); return; }
          if (doorCD <= 0) { showToast('MANCANO ANELLI!'); doorCD = 2.5; }
        }

    }

}

function physics(dt) {
  const b = ball;
  keys.left = BTN.left; keys.right = BTN.right; keys.jump = BTN.a || BTN.up;
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const sub = waterSub(b);

  waterCD -= dt;
  if (sub > 0) {
    const buoy = b.big ? 2.1 : 0.55;
    b.vy += G * (1 - buoy * sub) * dt;
    b.vy *= Math.exp(-2.4 * dt); b.vx *= Math.exp(-0.7 * dt);
    if (!b.big && b.vy > 3) b.vy = 3;
    if (b.big && keys.jump && sub > 0.15 && sub < 0.95 && waterCD <= 0 && b.vy > -3) { b.vy = -JUMP * 0.85; waterCD = 0.5; sfx.jump(); }
  } else b.vy += G * dt;
  if (b.vy > MAXFALL) b.vy = MAXFALL;
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.rot += b.vx * dt / b.r;
  b.grounded = false;
  collide(b);

}

function burst(x, y, col, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = sp * (0.4 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 0.6 + Math.random() * 0.5, col, sz: 0.08 + Math.random() * 0.1 });
  }
}

function updateCam(dt, snap) {
  if (!ball || !L) return;
  let tx = ball.x - vw / 2 + clamp(ball.vx * 0.25, -1.5, 1.5), ty = ball.y - vh * 0.55;
  tx = L.W <= vw ? (L.W - vw) / 2 : clamp(tx, 0, L.W - vw);
  ty = L.H <= vh ? (L.H - vh) / 2 : clamp(ty, 0, L.H - vh);
  if (snap) { cam.x = tx; cam.y = ty; }

function step(dt) {
  time += dt; stateT += dt;
  if (state === 'play') {

    if (state === 'play' && hazard(ball)) pop();
  }
  if (state === 'play' || state === 'dead' || state === 'complete') {
    for (const e of enemies) {
      const k = e.axis === 'x' ? 'x' : 'y';
      e[k] += e.dir * e.speed * dt;
      if (e[k] > e.max) { e[k] = e.max; e.dir = -1; }
      if (e[k] < e.min) { e[k] = e.min; e.dir = 1; }
      e.a += dt * 3;
    }
  }
  if (state === 'dead') {
    deadT -= dt;
    if (deadT <= 0) { if (lives <= 0) gameOver(); else { spawnBall(); state = 'play'; } }
  }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 18 * dt; p.life -= dt; }
  if (particles.length) particles = particles.filter(p => p.life > 0);
  if (ball && ball.sq) ball.sq = Math.max(0, ball.sq - dt * 1.6);
  if (state === 'play') updateCam(dt, false);
  if (toast && (toast.t -= dt) <= 0) toast = null;
  if (intro > 0) intro -= dt;

}

function genKarst(seed, len, minH, maxH, flatFrom) {
  const r = rng(seed), h = new Array(len); let cur = minH, target = minH, run = 0;
  for (let x = 0; x < len; x++) {
    if (x < 110 || x >= flatFrom) { h[x] = minH; cur = minH; continue; }
    if (run <= 0) { target = minH + Math.floor(r() * (maxH - minH + 1)); run = 2 + Math.floor(r() * 8); }
    run--;
    if (cur < target && r() < 0.75) cur++; else if (cur > target && r() < 0.75) cur--;
    let v = cur; if (r() < 0.12) v = Math.min(maxH, v + 1 + Math.floor(r() * 2));
    h[x] = v;
  }
  return h;
}
function genBase(seed, len, flatFrom) {
  const r = rng(seed), h = new Array(len); let x = 0;
  while (x < len) {
    const w = 5 + Math.floor(r() * 10), v = (x < 110 || x >= flatFrom) ? 2 : [2, 3, 5, 7][Math.floor(r() * 4)];
    for (let i = 0; i < w && x < len; i++, x++) h[x] = v;
  }

}

  const len = Math.ceil((L.bossT + 120) * SCROLL) + SW + 50, flat = Math.floor((L.bossT - 3) * SCROLL) + SW;
  terrB = L.terrain === 'karst' ? genKarst(i * 977 + 3, len, 1, 9, flat) : L.terrain === 'cave' ? genKarst(i * 977 + 5, len, 1, 8, flat) : L.terrain === 'base' ? genBase(i * 977 + 7, len, flat) : null;
  terrT = L.terrain === 'cave' ? genKarst(i * 977 + 11, len, 1, 7, flat) : null;
  stars = []; if (L.stars) for (let j = 0; j < 16; j++) stars.push({ x: Math.random() * SW, y: PT + 1 + Math.random() * (SH - PT - 2), v: Math.random() < 0.5 ? 5 : 10 });
  player = { x: -9, y: midY(), alive: true, inv: 0, cool: 0, dead: 0 };
  state = 'intro'; stateT = 0;
}

function spawnEnemy(w, i, x = SW + 1, y = null) {
  const d = EDEF[w.type], s = SPR[d.spr[0]];
  const e = { type: w.type, x, y: y ?? (w.y + w.dy * i), hp: d.hp, t: 0, ph: i * 0.8, fireT: 0.7 + Math.random() * 1.2, w: s.w, h: s.h, flash: 0, drop: (w.drop && i === w.n - 1) ? w.drop : null };
  e.baseY = e.y;
  if (w.type === 'E') e.wx = Math.floor(scroll) + Math.round(x);
  if (w.type === 'G') e.vy = (i % 2 ? 1 : -1) * 20;
  if (w.type === 'F') e.mode = 0;
  enemies.push(e);
}
function explosion(x, y, n, sp = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (8 + Math.random() * 22) * sp;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.25 + Math.random() * 0.35 });
  }
}
function aimed(x, y, sp) {
  const dx = player.x + 4 - x, dy = player.y + 2 - y, d = Math.hypot(dx, dy) || 1;
  ebullets.push({ x, y, vx: dx / d * sp, vy: dy / d * sp });
}
const bspeed = () => 30 + lvl * 3;

function damage(e, d) {
  if (e.hp <= 0) return;
  e.hp -= d; e.flash = 0.08; sfx.hit();
  if (e.hp <= 0) {
    explosion(e.x + e.w / 2, e.y + e.h / 2, 10); sfx.boom(); score += EDEF[e.type].score;
    if (e.drop) pickups.push({ kind: e.drop, x: e.x, y: clamp(e.y, PT + 1, SH - 9), t: 0 });
  }
}
function hitBoss(d) {
  if (!boss || boss.dying || boss.state !== 'fight') return;
  boss.hp -= d; boss.flash = 0.08; sfx.hit();
  if (boss.hp <= 0) { boss.hp = 0; boss.dying = true; boss.dieT = 0; score += 500; ebullets = []; sfx.bigBoom(); }
}
function killPlayer() {
  if (!player.alive || player.inv > 0) return;
  player.alive = false; player.dead = 1.8; lives--; laser = null;
  explosion(player.x + 4, player.y + 2, 26, 1.4); sfx.die();
}
function respawn() { player.alive = true; player.x = 4; player.y = midY(); player.inv = 2.5; ebullets = []; }
function gameOver() { state = 'over'; stateT = 0; saveBest(); sfx.over(); }
function playerHits() {
  for (let j = 0; j < 5; j++) for (let i = 0; i < 8; i++)
    if (SPR.ship.d[j * 8 + i] && solidAt(player.x + i, player.y + j)) return true;
  return false;
}
function fireSpecial() {
  if (!player.alive || !special.n) return;
  if (special.type === 'M') { bullets.push({ kind: 'm', x: player.x + 5, y: player.y + 1, vx: 70, vy: 0, dmg: 4 }); sfx.missile(); }
  else if (special.type === 'L') { laser = { t: 0.45, tick: 0 }; sfx.laser(); }
  else if (special.type === 'W') { walls.push({ x: player.x + 9, y: clamp(Math.round(player.y - 5), PT, SH - 15), h: 15 }); sfx.wall(); }
  special.n--; if (!special.n) special.type = null;
}

// ---------- comandi (croce, A = fuoco, B = arma speciale, START = pausa) ----------
let specQ = false, firePrev = false;
function readInput() {
  return { x: (BTN.right ? 1 : 0) - (BTN.left ? 1 : 0), y: (BTN.down ? 1 : 0) - (BTN.up ? 1 : 0), fire: BTN.a };
}
function togglePause() { if (['play', 'intro', 'clear'].includes(state)) paused = !paused; }

// ---------- logica ----------
function step(dt) {
  time += dt; stateT += dt;
  const inp = readInput(), pressed = inp.fire && !firePrev; firePrev = inp.fire;
  if (state === 'title') { if (pressed) startGame(); specQ = false; return; }
  if (state === 'over' || state === 'win') { if (pressed && stateT > 1) { state = 'title'; stateT = 0; } updateParts(dt); specQ = false; return; }
  if (paused) { if (pressed) paused = false; specQ = false; return; }
  updateParts(dt);
  for (const s of stars) { s.x -= s.v * dt; if (s.x < 0) { s.x += SW; s.y = PT + 1 + Math.random() * (SH - PT - 2); } }
  if (state === 'intro') {
    scroll += SCROLL * dt;
    player.x = -9 + Math.min(1, stateT / 1.2) * 13;
    if (stateT > 2.4) { state = 'play'; stateT = 0; }
    specQ = false; return;
  }
  if (state === 'clear') {
    scroll += SCROLL * dt;
    if (stateT > 0.8) player.x += 55 * dt;
    updateShots(dt);
    if (stateT > 3) { if (lvl + 1 < LV.length) loadLevel(lvl + 1); else { state = 'win'; stateT = 0; saveBest(); sfx.win(); } }
    specQ = false; return;
  }

  // --- in gioco ---
  levelTime += dt; scroll += SCROLL * dt;
  const L = LV[lvl];
  for (const w of waves) while (w.done < w.n && levelTime >= w.t + w.done * w.gap) { spawnEnemy(w, w.done); w.done++; }
  if (!warned && levelTime >= L.bossT - 2.5) { warned = true; sfx.warn(); }
  if (!bossSpawned && levelTime >= L.bossT) {
    bossSpawned = true;
    const d = BOSS[lvl], s = SPR[d.spr];
    boss = { d, s, w: s.w, h: s.h, x: SW + 2, cy: PT + (SH - PT - s.h) / 2, hp: d.hp, max: d.hp, t: 0, state: 'enter',
      fire: d.fire.map(f => ({ ...f, cd: f.every })), minCd: d.minion ? d.minion.every : 0, burst: 0, burstCd: 0, flash: 0, dying: false, raged: false };
    boss.y = boss.cy;
  }

  // giocatore
  if (player.alive) {
    let mx = inp.x, my = inp.y; if (mx && my) { mx *= 0.7071; my *= 0.7071; }
    player.x = clamp(player.x + mx * 36 * dt, 0, SW - 8);
    player.y = clamp(player.y + my * 36 * dt, PT, SH - 5);
    player.cool -= dt;
    if (inp.fire && player.cool <= 0 && bullets.filter(b => b.kind === 'b').length < 4) {
      bullets.push({ kind: 'b', x: player.x + 8, y: player.y + 2, vx: 95, vy: 0, dmg: 1 }); player.cool = 0.2; sfx.shoot();
    }
    if (specQ) fireSpecial();
    if (player.inv > 0) player.inv -= dt;
    else if (playerHits()) killPlayer();
  } else {
    player.dead -= dt;
    if (player.dead <= 0) { if (lives > 0) respawn(); else { gameOver(); return; } }
  }
  specQ = false;

  updateEnemies(dt);
  updateBoss(dt);
  updateShots(dt);
  collisions(dt);
}

function updateParts(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  if (parts.length) parts = parts.filter(p => p.life > 0);
}

function updateEnemies(dt) {
  const tb = terrB ? 10 : 0, tt = terrT ? 8 : 0;
  for (const e of enemies) {
    e.t += dt; if (e.flash > 0) e.flash -= dt;
    switch (e.type) {
      case 'A': e.x -= 26 * dt; break;
      case 'B': e.x -= 20 * dt; e.y = e.baseY + Math.sin(e.t * 4 + e.ph) * 5; break;
      case 'C': e.x -= 12 * dt; break;
      case 'D': e.x -= (SCROLL + 4) * dt; e.y += clamp(player.y + 2 - (e.y + 2), -1, 1) * 6 * dt; break;
      case 'E': {
        e.x = e.wx - scroll; let m = 0;
        for (let i = 0; i < e.w; i++) m = Math.max(m, hB(e.wx + i));
        e.y = SH - m - e.h; break;
      }
      case 'F':
        if (e.mode === 0) { e.x -= 28 * dt; if (e.x < 58) { e.mode = 1; e.vy = Math.sign(player.y - e.y) * 26; } }
        else { e.x -= 34 * dt; e.y += e.vy * dt; }
        break;
      case 'G':
        e.x -= 18 * dt; e.y += e.vy * dt;
        if (e.y < PT + 1 + tt) { e.y = PT + 1 + tt; e.vy = Math.abs(e.vy); }
        if (e.y > SH - e.h - 1 - tb) { e.y = SH - e.h - 1 - tb; e.vy = -Math.abs(e.vy); }
        break;
      case 'R': e.x -= 11 * dt; break;
    }
    if (player.alive && e.x < SW - 4 && e.x > 8 && 'CEGB'.includes(e.type)) {
      e.fireT -= dt;
      if (e.fireT <= 0) {
        if (e.type === 'C') { ebullets.push({ x: e.x - 2, y: e.y + 2, vx: -(bspeed() + 8), vy: 0 }); e.fireT = 1.7; sfx.eshoot(); }
        else if (e.type === 'E') { aimed(e.x, e.y, bspeed()); e.fireT = 2.3; sfx.eshoot(); }
        else if (e.type === 'G') { aimed(e.x, e.y + 2, bspeed()); e.fireT = 2.8; sfx.eshoot(); }
        else { if (Math.random() < 0.4) { ebullets.push({ x: e.x, y: e.y + 3, vx: -bspeed(), vy: 0 }); sfx.eshoot(); } e.fireT = 1.6; }
      }
    }
  }
  enemies = enemies.filter(e => e.hp > 0 && e.x > -e.w - 3 && e.y > -12 && e.y < SH + 6);
}

function updateBoss(dt) {
  const b = boss; if (!b) return;
  b.t += dt; if (b.flash > 0) b.flash -= dt;
  if (b.dying) {
    b.dieT += dt;
    if (Math.random() < dt * 12) { explosion(b.x + Math.random() * b.w, b.y + Math.random() * b.h, 6); sfx.boom(); }
    if (b.dieT > 1.6) { explosion(b.x + b.w / 2, b.y + b.h / 2, 34, 1.6); boss = null; state = 'clear'; stateT = 0; laser = null; sfx.clear(); }
    return;
  }
  if (b.state === 'enter') { b.x -= 12 * dt; if (b.x <= SW - b.w - 3) { b.x = SW - b.w - 3; b.state = 'fight'; b.t = 0; } return; }
  const d = b.d;
  b.y = clamp(b.cy + Math.sin(b.t * d.freq) * d.amp, PT + 1, SH - b.h - 1);
  if (lvl === 2) b.x = SW - b.w - 3 - (Math.sin(b.t * 0.7) * 0.5 + 0.5) * 10;
  if (d.rage && !b.raged && b.hp < b.max / 2) { b.raged = true; b.fire.push({ ...d.rage, cd: 0.6 }); }
  if (!player.alive) return;
  const ox = b.x, oy = b.y + b.h / 2 - 0.5, sp = bspeed();
  for (const f of b.fire) {
    f.cd -= dt;
    if (f.cd > 0) continue;
    f.cd = f.every; sfx.eshoot();
    if (f.type === 'aim') aimed(ox, oy, sp + 2);
    else if (f.type === 'burst') { b.burst = 3; b.burstCd = 0; }
    else {
      const offs = f.type === 'spread5' ? [-0.6, -0.3, 0, 0.3, 0.6] : [-0.35, 0, 0.35];
      for (const o of offs) { const a = Math.PI + o; ebullets.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp }); }
    }
  }
  if (b.burst > 0) { b.burstCd -= dt; if (b.burstCd <= 0) { ebullets.push({ x: ox, y: oy, vx: -(sp + 8), vy: 0 }); b.burst--; b.burstCd = 0.14; } }
  if (d.minion) { b.minCd -= dt; if (b.minCd <= 0) { b.minCd = d.minion.every; spawnEnemy({ type: d.minion.type, y: 0, dy: 0, n: 1 }, 0, b.x - 4, clamp(oy - 2, PT + 1, SH - 8)); } }
}

function updateShots(dt) {
  for (const b of bullets) {
    if (b.kind === 'm') {
      let best_ = null, bd = 1e9;
      for (const e of enemies) if (e.x > b.x) { const d = e.x - b.x; if (d < bd) { bd = d; best_ = e.y + e.h / 2; } }
      if (boss && boss.state === 'fight' && best_ === null) best_ = boss.y + boss.h / 2;
      if (best_ !== null) b.vy = clamp(b.vy + clamp(best_ - (b.y + 1.5), -1, 1) * 70 * dt, -24, 24);
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x > SW + 2 || b.y < PT - 4 || b.y > SH) b.dead = true;
    else if (solidAt(b.x + (b.kind === 'm' ? 4 : 2), b.y + (b.kind === 'm' ? 1 : 0))) { b.dead = true; explosion(b.x + 2, b.y, 3, 0.5); }
  }
  bullets = bullets.filter(b => !b.dead);
  for (const e of ebullets) {
    e.x += e.vx * dt; e.y += e.vy * dt;
    if (e.x < -3 || e.x > SW + 3 || e.y < PT - 2 || e.y > SH + 1 || solidAt(e.x, e.y)) e.dead = true;
  }
  ebullets = ebullets.filter(e => !e.dead);
  for (const w of walls) { w.x += 40 * dt; if (w.x > SW) w.dead = true; }
  walls = walls.filter(w => !w.dead);
  for (const p of pickups) { p.t += dt; p.x -= 14 * dt; if (p.x < -8) p.dead = true; }
  pickups = pickups.filter(p => !p.dead);
}

function collisions(dt) {
  const bf = boss && boss.state === 'fight' && !boss.dying;
  for (const b of bullets) {
    const bw = b.kind === 'm' ? 5 : 3, bh = b.kind === 'm' ? 3 : 1;
    for (const e of enemies) if (e.hp > 0 && overlap(b.x, b.y, bw, bh, e.x, e.y, e.w, e.h)) { damage(e, b.dmg); b.dead = true; if (b.kind === 'm') explosion(b.x + 4, b.y + 1, 6); break; }
    if (!b.dead && bf && overlap(b.x, b.y, bw, bh, boss.x + 1, boss.y + 1, boss.w - 2, boss.h - 2)) { hitBoss(b.dmg); b.dead = true; if (b.kind === 'm') explosion(b.x + 4, b.y + 1, 6); }
  }
  bullets = bullets.filter(b => !b.dead);

  for (const w of walls) {
    for (const e of enemies) if (e.hp > 0 && overlap(w.x, w.y, 2, w.h, e.x, e.y, e.w, e.h)) damage(e, 99);
    for (const eb of ebullets) if (overlap(w.x - 1, w.y, 4, w.h, eb.x, eb.y, 2, 1)) eb.dead = true;
    if (bf && overlap(w.x, w.y, 2, w.h, boss.x, boss.y, boss.w, boss.h)) { hitBoss(6); w.dead = true; explosion(w.x, w.y + w.h / 2, 10); }
  }
  walls = walls.filter(w => !w.dead);

  if (laser && player.alive) {
    laser.t -= dt; laser.tick -= dt;
    const ly = player.y + 2, lx = player.x + 8;
    if (laser.tick <= 0) {
      laser.tick = 0.07;
      for (const e of enemies) if (e.hp > 0 && e.x + e.w > lx && e.y <= ly + 1 && e.y + e.h >= ly - 1) damage(e, 1);
      if (bf && boss.y <= ly + 1 && boss.y + boss.h >= ly - 1) hitBoss(1);
    }
    for (const eb of ebullets) if (eb.x > lx && Math.abs(eb.y - ly) < 1.5) eb.dead = true;
    if (laser.t <= 0) laser = null;
  }
  ebullets = ebullets.filter(e => !e.dead);
  enemies = enemies.filter(e => e.hp > 0);

  if (!player.alive) return;
  const hx = player.x + 1, hy = player.y + 1, hw = 6, hh = 3;
  for (const p of pickups) {
    if (!overlap(player.x, player.y, 8, 5, p.x, p.y, 7, 7)) continue;
    p.dead = true; score += 50;
    if (p.kind === 'V') { lives = Math.min(9, lives + 1); sfx.life(); }
    else { const amt = p.kind === 'M' ? 5 : 3; if (special.type === p.kind) special.n += amt; else special = { type: p.kind, n: amt }; sfx.pick(); }
  }
  pickups = pickups.filter(p => !p.dead);
  if (player.inv > 0) return;
  for (const eb of ebullets) if (overlap(hx, hy, hw, hh, eb.x, eb.y, 2, 1)) { eb.dead = true; killPlayer(); return; }
  for (const e of enemies) if (overlap(hx, hy, hw, hh, e.x, e.y, e.w, e.h)) { damage(e, 2); killPlayer(); return; }
  if (boss && !boss.dying && overlap(hx, hy, hw, hh, boss.x + 1, boss.y + 1, boss.w - 2, boss.h - 2)) killPlayer();
}

// ---------- disegno nel framebuffer ----------
function drawTerrain() {
  const s = Math.floor(scroll);
  for (let x = 0; x < SW; x++) {
    const wx = s + x;
    if (terrB) {
      const h = hB(wx), hl = hB(wx - 1), hr = hB(wx + 1);
      for (let i = 0; i < h; i++) {
        const y = SH - 1 - i;
        if (i === h - 1 || i >= hl || i >= hr || ((wx + y) % 2 === 0 && y % 2 === 0)) px(x, y);
      }
    }
    if (terrT) {
      const h = hT(wx), hl = hT(wx - 1), hr = hT(wx + 1);
      for (let i = 0; i < h; i++) {
        const y = PT + i;
        if (i === h - 1 || i >= hl || i >= hr || ((wx + y) % 2 === 0 && y % 2 === 1)) px(x, y);
      }
    }
  }
}
function drawHUD() {
  const lv = Math.max(0, lives);
  if (lv <= 5) for (let i = 0; i < lv; i++) spr(SPR.heart, 1 + i * 4, 1);
  else { spr(SPR.heart, 1, 1); text('x' + lv, 5, 0); }
  if (special.type) { text(special.type, 23, 0); text(String(special.n), 27, 0); }
  if (boss && !boss.dying) {
    frame(35, 0, 24, 5);
    const f = Math.ceil(22 * boss.hp / boss.max);
    for (let i = 0; i < f; i++) for (let j = 1; j < 4; j++) px(36 + i, j);
  }
  text(String(Math.min(99999, score)).padStart(5, '0'), SW - 19, 0);
  for (let x = 0; x < SW; x++) px(x, 5);
}
function drawGame() {
  for (const s of stars) px(s.x, s.y);
  drawTerrain();
  for (const p of pickups) {
    const x = Math.round(p.x), y = Math.round(p.y);
    clearBox(x, y, 7, 7);
    if (Math.floor(p.t * 5) % 2 === 0) frame(x, y, 7, 7); else { px(x, y); px(x + 6, y); px(x, y + 6); px(x + 6, y + 6); }
    if (p.kind === 'V') spr(SPR.heart5, x + 1, y + 1); else text(p.kind, x + 2, y + 1);
  }
  for (const e of enemies) {
    if (e.flash > 0 && Math.floor(time * 30) % 2) continue;
    const d = EDEF[e.type], s = SPR[d.spr[d.spr.length > 1 ? Math.floor(e.t * 4) % 2 : 0]];
    spr(s, e.x, e.y);
  }
  if (boss && !(boss.flash > 0 && Math.floor(time * 30) % 2) && !(boss.dying && Math.floor(time * 16) % 2)) spr(boss.s, boss.x, boss.y);
  for (const w of walls) for (let j = 0; j < w.h; j++) { if (j % 3 !== 2) px(w.x, w.y + j); if ((j + 1) % 3 !== 2) px(w.x + 1, w.y + j); }
  if (laser && player.alive) {
    const ly = Math.round(player.y + 2), f = Math.floor(time * 30) % 2;
    for (let x = Math.round(player.x + 8); x < SW; x++) { px(x, ly); if ((x + f) % 2) px(x, f ? ly - 1 : ly + 1); }
  }
  for (const b of bullets) { if (b.kind === 'm') spr(SPR.missile, b.x, b.y); else { px(b.x, b.y); px(b.x + 1, b.y); px(b.x + 2, b.y); } }
  for (const e of ebullets) { px(e.x, e.y); px(e.x + 1, e.y); }
  if (player.alive && !(player.inv > 0 && Math.floor(player.inv * 10) % 2)) spr(SPR.ship, player.x, player.y);
  for (const p of parts) px(p.x, p.y);
  drawHUD();
}
function drawTitle() {
  ctext('ASTRO', 3, 2);
  ctext('RAID', 15, 2);
  const sx = ((time * 22) % (SW + 30)) - 15;
  spr(SPR.ship, sx, 27);
  for (let i = 1; i <= 3; i++) { const bx = sx + 8 + ((time * 60 + i * 12) % 36); if (bx < SW) { px(bx, 29); px(bx + 1, 29); px(bx + 2, 29); } }
  if (Math.floor(time * 2.5) % 2 === 0) ctext('PREMI A PER GIOCARE', 35);
  ctext('RECORD ' + String(best).padStart(5, '0'), 42);
}
function drawEnd(win) {
  ctext(win ? 'VITTORIA!' : 'GAME OVER', 5, 2);
  if (win) { ctext('HAI SALVATO', 19); ctext('LA GALASSIA!', 25); }
  ctext('PUNTI ' + String(score).padStart(5, '0'), win ? 31 : 21);
  ctext('RECORD ' + String(best).padStart(5, '0'), win ? 37 : 28);
  if (stateT > 1 && Math.floor(time * 2.5) % 2 === 0) ctext('PREMI A', win ? 43 : 39);
  for (const p of parts) px(p.x, p.y);
}
function compose() {
  fb.fill(0);
  if (state === 'title') { drawTitle(); return; }
  if (state === 'over') { drawEnd(false); return; }
  if (state === 'win') { drawEnd(true); return; }
  drawGame();
  if (state === 'intro') banner(['LIVELLO ' + (lvl + 1), LV[lvl].name]);

}
const setKb = (n, v) => { kbB[n] = v; syncBtn(n); };
const setT = (n, v) => { tB[n] = v; syncBtn(n); };

const dpadEl = $('dpad'), dptr = new Map();
function dpadDir(e) {
  const r = dpadEl.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < r.width * 0.11) return { x: 0, y: 0 };
  let deg = Math.atan2(dy, dx) * 180 / Math.PI; if (deg < 0) deg += 360;
  const axis = Math.round(deg / 90) * 90, dev = Math.abs(deg - axis);
  if (dev > 30) { const d = Math.round((deg - 45) / 90) * 90 + 45, a = d * Math.PI / 180; return { x: Math.sign(Math.round(Math.cos(a) * 10)), y: Math.sign(Math.round(Math.sin(a) * 10)) }; }
  const a = axis * Math.PI / 180; return { x: Math.round(Math.cos(a)), y: Math.round(Math.sin(a)) };
}
function syncDpad() {
  let d = { x: 0, y: 0 }; for (const v of dptr.values()) d = v;
  setT('left', d.x < 0); setT('right', d.x > 0); setT('up', d.y < 0); setT('down', d.y > 0);
}
dpadEl.addEventListener('pointerdown', e => { e.preventDefault(); audioUnlock(); try { dpadEl.setPointerCapture(e.pointerId); } catch (_) {} dptr.set(e.pointerId, dpadDir(e)); syncDpad(); });
dpadEl.addEventListener('pointermove', e => { if (dptr.has(e.pointerId)) { dptr.set(e.pointerId, dpadDir(e)); syncDpad(); } });
const dpUp = e => { if (dptr.delete(e.pointerId)) syncDpad(); };
dpadEl.addEventListener('pointerup', dpUp); dpadEl.addEventListener('pointercancel', dpUp); dpadEl.addEventListener('lostpointercapture', dpUp);

function bindBtn(id, name) {
  const el = $(id), ids = new Set();
  el.addEventListener('pointerdown', e => { e.preventDefault(); audioUnlock(); try { el.setPointerCapture(e.pointerId); } catch (_) {} ids.add(e.pointerId); setT(name, true); });
  const up = e => { if (ids.delete(e.pointerId) && !ids.size) setT(name, false); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
bindBtn('bA', 'a'); bindBtn('bB', 'b'); bindBtn('bSta', 'start'); bindBtn('bSel', 'select');

const KEYS = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  Digit2: 'up', Numpad2: 'up', Digit8: 'down', Numpad8: 'down', Digit4: 'left', Numpad4: 'left', Digit6: 'right', Numpad6: 'right',
  KeyX: 'a', KeyK: 'a', Space: 'a', Digit5: 'a', Numpad5: 'a', KeyZ: 'b', KeyJ: 'b', Digit0: 'b', Numpad0: 'b',
  Enter: 'start', KeyP: 'start', Escape: 'select', Backspace: 'select', ShiftRight: 'select'
};
addEventListener('keydown', e => { const n = KEYS[e.code]; if (!n) return; e.preventDefault(); audioUnlock(); if (!e.repeat) setKb(n, true); });
addEventListener('keyup', e => { const n = KEYS[e.code]; if (n) setKb(n, false); });
addEventListener('blur', () => { for (const n in BTN) { kbB[n] = false; tB[n] = false; syncBtn(n); } dptr.clear(); });
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) document.addEventListener(ev, audioUnlock, { capture: true, passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden && cur && cur.hidden) cur.hidden(); });

// icona del volume a pixel: alto, medio, spento
const VOLICON = [
  ['.....#.......', '....##.......', '...###.......', '######.#...#.', '######..#.#..', '######...#...', '######..#.#..', '######.#...#.', '...###.......', '....##.......', '.....#.......'],
  ['.....#.......', '....##.......', '...###.......', '######..#....', '######...#...', '######...#...', '######...#...', '######..#....', '...###.......', '....##.......', '.....#.......'],
  ['.....#.......', '....##...#...', '...###....#..', '######..#..#.', '######...#.#.', '######...#.#.', '######...#.#.', '######..#..#.', '...###....#..', '....##...#...', '.....#.......']];
function pixSvg(rows, k) {
  let d = '';
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; });
  return '<svg viewBox="0 0 ' + rows[0].length + ' ' + rows.length + '" width="' + rows[0].length * k + '" height="' + rows.length * k + '" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="' + d + '"/></svg>';
}
function volIcon() {
  const b = $('vol'); b.innerHTML = pixSvg(VOLICON[volLevel], 2);
  b.classList.toggle('off', volLevel === 0); b.title = ['Audio spento', 'Audio medio', 'Audio alto'][volLevel];
}
volIcon();
$('vol').addEventListener('click', () => { audioUnlock(); setVolume((volLevel + 2) % 3); volIcon(); if (volLevel) tone(1318, 0.07); });

// ---------- versione e aggiornamenti (solo nell'app installata) ----------
let infoOpen = false;
const upd = { st: 'idle', remote: null, last: 0 };
async function checkUpdate(manual) {
  if (!APP.pwa || upd.st === 'checking' || upd.st === 'updating') return;
  upd.st = 'checking'; upd.last = Date.now();
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json(); upd.remote = j;
    upd.st = j.id && j.id !== APP.id ? 'new' : 'ok';
    if (upd.st === 'new') seq([784, 1047, 1319], 0.08, 0.08, 0.04);
  } catch (e) { upd.st = manual ? 'err' : 'idle'; }
}
async function applyUpdate() {
  if (upd.st === 'updating') return;
  upd.st = 'updating';
  try { if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (e) {}
  try { if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  location.replace(location.pathname + '?agg=' + Date.now());   // indirizzo nuovo: niente copie vecchie
}
if (APP.pwa) {
  if (location.search.indexOf('agg=') >= 0) try { history.replaceState(null, '', location.pathname); } catch (e) {}
  setTimeout(() => checkUpdate(false), 2500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - upd.last > 10 * 60 * 1000) checkUpdate(false); });
}
function infoButton(name) {
  if (name === 'a') { if (!APP.pwa) return; if (upd.st === 'new') applyUpdate(); else checkUpdate(true); tone(1046, 0.05); }
  else if (name === 'b' || name === 'select' || name === 'start') { infoOpen = false; tone(660, 0.04); }
}

// tocco sullo schermo
const toDev = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioUnlock(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const [x, y] = toDev(e);
  if (mode === 'boot') { bootT = 99; return; }
  if (quitAsk) return;
  if (mode === 'menu') { menuTap = { x, y, id: e.pointerId }; return; }
  if (cur && cur.pointer) cur.pointer('down', x, y, e.pointerId);
});
cv.addEventListener('pointermove', e => { if (mode === 'game' && !quitAsk && cur && cur.pointer) { const [x, y] = toDev(e); cur.pointer('move', x, y, e.pointerId); } });
cv.addEventListener('pointerup', e => {
  const [x, y] = toDev(e);
  if (mode === 'menu' && infoOpen && menuTap && menuTap.id === e.pointerId) { menuTap = null; infoButton(upd.st === 'new' ? 'a' : 'b'); return; }
  if (mode === 'menu' && menuTap && menuTap.id === e.pointerId) {
    menuTap = null;
    const i = menuRects.findIndex(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
    if (i >= 0) { msel = i; launch(i); }
    return;
  }
  if (mode === 'game' && !quitAsk && cur && cur.pointer) cur.pointer('up', x, y, e.pointerId);
});
cv.addEventListener('pointercancel', e => { menuTap = null; if (mode === 'game' && cur && cur.pointer) cur.pointer('cancel', 0, 0, e.pointerId); });

// ---------- smistamento dei tasti ----------
function onButton(name, down) {
  if (down) audioUnlock();
  if (mode === 'boot') { if (down) bootT = 99; return; }
  if (quitAsk) {
    if (!down) return;
    if (name === 'a') { quitAsk = false; leave(); }
    else if (name === 'b' || name === 'select' || name === 'start') { quitAsk = false; tone(660, 0.04); }
    return;
  }
  if (mode === 'menu') { if (down) menuButton(name); return; }
  if (name === 'select') { if (down) { quitAsk = true; tone(880, 0.05); } return; }
  if (cur) cur.button(name, down);
}
function launch(i) {
  msel = i; try { localStorage.setItem('px_sel', i); } catch (e) {}
  cur = GAMES[i]; mode = 'game'; quitAsk = false;
  seq([1046, 1568], 0.06, 0.07);
  cur.enter();
  layoutFor(cur);
}
function leave() {
  if (cur) cur.leave();
  cur = null; mode = 'menu';
  layoutFor(null);
  tone(523, 0.06);
}
function menuCols() { return W / H > 1.15 ? 2 : 1; }
function menuButton(name) {
  if (infoOpen) return infoButton(name);
  if (name === 'select') { infoOpen = true; tone(988, 0.05); if (APP.pwa && upd.st !== 'new') checkUpdate(true); return; }
  const n = GAMES.length, cols = menuCols();
  let s = msel;
  if (name === 'up') s -= cols; else if (name === 'down') s += cols;
  else if (name === 'left' && cols > 1) s -= 1; else if (name === 'right' && cols > 1) s += 1;
  else if (name === 'a' || name === 'start') { launch(msel); return; }
  else return;
  s = (s + n) % n;
  if (s !== msel) { msel = s; tone(1318, 0.03, 'square', 0.03); }
}

// ---------- disegno del menu ----------
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fitFont(str, maxW, size) { ctx.font = PF(size); let s = size; while (s > 6 && ctx.measureText(str).width > maxW) { s -= 1; ctx.font = PF(s); } return s; }
function shadowText(str, x, y, size, col, sh, align = 'left') {
  ctx.font = PF(size); ctx.textAlign = align; ctx.textBaseline = 'top';
  if (sh) { ctx.fillStyle = sh; ctx.fillText(str, x + Math.max(1, size * 0.08), y + Math.max(1, size * 0.08)); }
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}
const BELL = ['..##..', '.####.', '.####.', '######', '..##..'];
function drawMenu() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#16202c'); bg.addColorStop(1, '#0c1118');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const n = GAMES.length, cols = menuCols(), rows = Math.ceil(n / cols);
  const u = Math.min(W / (cols === 1 ? 21 : 32), H / (rows * 3.7 + 6.2));
  const top = u * 4.6, pad = u * 0.7, gap = u * 0.45;
  const cw = (W - pad * 2 - gap * (cols - 1)) / cols;
  const ch = Math.min(u * 3.4, (H - top - u * 1.9 - gap * (rows - 1)) / rows);
  const ts = fitFont('PIXEL BOX', W - pad * 2, u * 1.45);
  shadowText('PIXEL BOX', W / 2, u * 0.9, ts, '#ffd23f', '#c83a24', 'center');
  shadowText('SCEGLI UN GIOCO', W / 2, u * 0.9 + ts * 1.45, Math.min(u * 0.5, ts * 0.45), '#8fa3b8', null, 'center');
  menuRects = [];
  for (let i = 0; i < n; i++) {
    const g = GAMES[i], x = pad + (i % cols) * (cw + gap), y = top + Math.floor(i / cols) * (ch + gap), sel = i === msel;
    menuRects.push({ x, y, w: cw, h: ch });
    rrect(x, y, cw, ch, u * 0.35); ctx.fillStyle = sel ? '#26384d' : '#1a2430'; ctx.fill();
    if (sel) { ctx.lineWidth = Math.max(2, u * 0.13); ctx.strokeStyle = Math.floor(gtime * 3) % 2 ? '#ffd23f' : '#ffe680'; ctx.stroke(); }
    const isz = ch - u * 0.7, ix = x + u * 0.35, iy = y + u * 0.35;
    g.icon(ctx, ix, iy, isz);
    ctx.lineWidth = Math.max(1, u * 0.06); ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.strokeRect(ix, iy, isz, isz);
    const tx = ix + isz + u * 0.55, tw = x + cw - tx - u * 0.4;
    const ns = fitFont(g.name, tw, u * 0.72);
    shadowText(g.name, tx, y + ch * 0.26, ns, sel ? '#ffffff' : '#d9e2ec', '#000000');
    const ds = fitFont(g.desc, tw, u * 0.42);
    shadowText(g.desc, tx, y + ch * 0.26 + ns * 1.55, ds, sel ? '#a9c6e3' : '#7f93a8', null);
    if (g.alert && g.alert() && Math.floor(gtime * 2) % 2 === 0) {
      const bs = u * 0.9; drawIcon(ctx, BELL, { '#': '#ffd23f' }, x + cw - bs - u * 0.3, y + u * 0.25, bs);
    }
  }
  if (upd.st === 'new') {
    const t = 'NUOVA VERSIONE! PREMI SELECT', hs = fitFont(t, W - pad * 2, u * 0.5);
    if (Math.floor(gtime * 2.5) % 2 === 0) shadowText(t, W / 2, H - u * 1.3, hs, '#ffd23f', '#000000', 'center');
  } else {
    const t = cols > 1 ? 'CROCE: SCEGLI   A: GIOCA   SELECT: INFO' : '▲▼ SCEGLI   A GIOCA   SELECT INFO';
    shadowText(t, W / 2, H - u * 1.25, fitFont(t, W - pad * 2, Math.min(u * 0.42, W / 34)), '#6f849b', null, 'center');
  }
  if (infoOpen) drawInfo();
}
function drawInfo() {
  ctx.fillStyle = 'rgba(6,9,14,.82)'; ctx.fillRect(0, 0, W, H);
  const bw = Math.min(W * 0.9, H * 1.25), bh = Math.min(H * 0.62, bw * 0.78), bx = (W - bw) / 2, by = (H - bh) / 2, u = bh / 10;
  rrect(bx, by, bw, bh, u * 0.4); ctx.fillStyle = '#16202c'; ctx.fill(); ctx.lineWidth = Math.max(2, u * 0.12); ctx.strokeStyle = '#ffd23f'; ctx.stroke();
  const line = (t, y, sz, col) => shadowText(t, W / 2, by + u * y, fitFont(t, bw * 0.86, u * sz), col, '#000000', 'center');
  line('PIXEL BOX', 0.9, 1.25, '#ffd23f');
  line('VERSIONE ' + APP.v + ' · ' + APP.date, 2.6, 0.55, '#c9d3e6');
  const st = !APP.pwa ? ['QUESTA PAGINA SI AGGIORNA DA SOLA', '#8fa3b8'] : {
    idle: ['', '#fff'], checking: ['CONTROLLO IN CORSO...', '#c9d3e6'], ok: ['SEI AGGIORNATO!', '#4ade80'],
    new: ['NUOVA VERSIONE ' + (upd.remote && upd.remote.v || '') + ' PRONTA!', '#ffd23f'], err: ['NESSUNA CONNESSIONE: RIPROVA PIU TARDI', '#ff8f8f'], updating: ['AGGIORNAMENTO...', '#ffd23f'] }[upd.st];
  if (st[0]) line(st[0], 4.4, 0.5, st[1]);
  if (APP.pwa) line(upd.st === 'new' ? 'A: AGGIORNA ORA' : 'A: CERCA AGGIORNAMENTI', 6.2, 0.6, upd.st === 'new' ? '#ffd23f' : '#ffffff');
  line('B: INDIETRO', 7.8, 0.5, '#8fa3b8');
}
function drawBoot() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#d9dccb'; ctx.fillRect(0, 0, W, H);
  const u = Math.min(W / 16, H / 12), ts = fitFont('PIXEL BOX', W * 0.86, u * 1.5);
  const y = Math.min(1, bootT / 1.1) * (H / 2 - ts) - ts * 1.2 * (1 - Math.min(1, bootT / 1.1));
  shadowText('PIXEL BOX', W / 2, y, ts, '#2c3a7a', '#a9adb8', 'center');
  if (bootT > 1.2) shadowText(GAMES.length + ' GIOCHI DEI RICORDI', W / 2, H / 2 + ts * 0.6, Math.min(u * 0.5, ts * 0.42), '#5b6488', null, 'center');
  if (bootT > 1.2) shadowText('VERSIONE ' + APP.v, W / 2, H - u * 0.9, u * 0.32, '#8a8fa0', null, 'center');
}
function drawQuit() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(6,10,14,.74)'; ctx.fillRect(0, 0, W, H);
  const u = Math.min(W / 18, H / 12), bw = Math.min(W - u, u * 15), bh = u * 6.4, bx = (W - bw) / 2, by = (H - bh) / 2;
  rrect(bx, by, bw, bh, u * 0.4); ctx.fillStyle = '#1a2430'; ctx.fill(); ctx.lineWidth = Math.max(2, u * 0.14); ctx.strokeStyle = '#ffd23f'; ctx.stroke();
  const s = fitFont('TORNARE AL MENU?', bw - u, u * 0.62);
  shadowText('TORNARE AL MENU?', W / 2, by + u * 1.3, s, '#ffffff', '#000', 'center');
  shadowText('A: SI     B: NO', W / 2, by + u * 3.9, s, '#ffd23f', '#000', 'center');
}

// ---------- ciclo principale ----------
let last = performance.now(), acc = 0, bootDing = false;
const DT = 1 / 60;
function tick(dt) {
  gtime += dt;
  for (const g of GAMES) if (g.background) g.background(dt, g === cur && mode === 'game');
  if (mode === 'boot') {
    bootT += dt;
    if (!bootDing && bootT > 1.1 && bootT < 5) { bootDing = true; tone(1046, 0.08, 'square', 0.04); tone(2093, 0.5, 'square', 0.035, null, 0.1); }
    if (bootT > 2.4) mode = 'menu';
  } else if (mode === 'game' && cur && !quitAsk) cur.update(dt);
}
function frameDraw() {
  if (mode === 'boot') drawBoot();
  else if (mode === 'menu') drawMenu();
  else if (cur) { cur.draw(ctx, W, H); if (quitAsk) drawQuit(); }
}
function loop(t) {
  acc += Math.min(0.1, (t - last) / 1000); last = t;
  while (acc >= DT) { tick(DT); acc -= DT; }
  frameDraw();
  requestAnimationFrame(loop);
}
layoutFor(null);
requestAnimationFrame(loop);

})();
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}));
</script>
